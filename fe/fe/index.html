<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vietnam Provinces API</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 2rem auto;
      max-width: 600px;
      padding: 0 1rem;
      background: #f5f5f5;
      color: #222;
    }
    h1 { color: #1a1a1a; }
    label { display: block; margin: 1rem 0 0.5rem; }
    input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #status, #headers {
      margin-top: 1rem;
      padding: 0.5rem;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-family: monospace;
      white-space: pre-wrap;
    }
    #results {
      margin-top: 1rem;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 1rem;
    }
    .province {
      padding: 0.25rem 0;
      border-bottom: 1px solid #eee;
    }
    .province:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <h1>Vietnam Provinces API Tester</h1>
  <p>This page calls the AWS Lambda endpoint <code>GET /provinces</code>. It tests the API directly from the browser.</p>
  <form id="form">
    <label for="q">Query (optional):</label>
    <input type="text" id="q" placeholder="e.g. Ho Chi Minh, da nang, hà nội" />
    <button type="submit">Fetch provinces</button>
  </form>
  <div id="status">Status: -</div>
  <div id="headers">Headers: -</div>
  <h2>Provinces</h2>
  <div id="results">No results yet.</div>

  <script type="module">
    const form = document.getElementById('form');
    const qInput = document.getElementById('q');
    const statusDiv = document.getElementById('status');
    const headersDiv = document.getElementById('headers');
    const resultsDiv = document.getElementById('results');

    // Base URL: change this to your deployed API Gateway endpoint if needed.
    // For local testing with SAM, use e.g. http://localhost:3000/provinces
    const API_BASE = window.API_BASE || window.location.origin;

    async function fetchProvinces(query) {
      const url = new URL(`${API_BASE}/provinces`);
      if (query && query.trim() !== '') {
        url.searchParams.set('q', query);
      }

      try {
        const response = await fetch(url, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });

        statusDiv.textContent = `Status: ${response.status} ${response.statusText}`;
        const headers = {};
        response.headers.forEach((value, key) => { headers[key] = value; });
        headersDiv.textContent = `Headers:\n${JSON.stringify(headers, null, 2)}`;

        const contentType = response.headers.get('Content-Type') || '';
        if (!response.ok) {
          const errorText = await response.text();
          resultsDiv.innerHTML = `<div class="error">Error: ${errorText || response.statusText}</div>`;
          return;
        }

        if (contentType.includes('application/json')) {
          const data = await response.json();
          if (Array.isArray(data)) {
            if (data.length === 0) {
              resultsDiv.innerHTML = '<p>No provinces found matching your query.</p>';
            } else {
              resultsDiv.innerHTML = data.map(p => `
                <div class="province">
                  <strong>${escapeHtml(p.code)}</strong> — ${escapeHtml(p.name)}
                </div>
              `).join('');
            }
          } else {
            resultsDiv.innerHTML = `<pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>`;
          }
        } else {
          resultsDiv.innerHTML = `<pre>${escapeHtml(await response.text())}</pre>`;
        }
      } catch (error) {
        statusDiv.textContent = `Status: Network error`;
        headersDiv.textContent = 'Headers: -';
        resultsDiv.innerHTML = `<div class="error">Failed to fetch: ${escapeHtml(error.message)}</div>`;
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      fetchProvinces(qInput.value);
    });

    // Load all provinces on first load
    fetchProvinces('');

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
