name = "internal-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Non-secret configuration only. Replace the placeholders before deploying.
[vars]
ACCESS_TEAM_DOMAIN = "your-team.cloudflareaccess.com"
ACCESS_AUD = "replace-with-access-application-aud-tag"
SERVICE_A_ORIGIN = "https://service-a.internal.example"
SERVICE_B_ORIGIN = "https://service-b.internal.example"
UPSTREAM_TIMEOUT_MS = "10000"
